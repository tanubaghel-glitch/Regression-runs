name: Run all tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      HEADLESS: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: mvn -B install -DskipTests

      - name: Run AcmeBankTests
        run: mvn -B exec:exec@run-the-tests -Dexec.classpathScope=test

      - name: Run LayoutRegionsTest
        if: always()
        run: mvn -B exec:exec@run-layout-regions-test -Dexec.classpathScope=test
